  <rect x="375" y="198" width="270" height="317" rx="34" fill="#f7f6ef" stroke="#e3e4dc" stroke-width="3"/>
  <circle cx="510" cy="354" r="48" fill="#e4e8e3" stroke="#cbd4ca" stroke-width="3"/>
