    <linearGradient id="wall" x2="1" y2="1"><stop stop-color="#deded4"/><stop offset="1" stop-color="#f4f0e7"/></linearGradient>
    <linearGradient id="device" x2=".9" y2="1"><stop stop-color="#fffefa"/><stop offset="1" stop-color="#deded4"/></linearGradient>
    <filter id="shadow"><feGaussianBlur stdDeviation="21"/></filter>
  </defs>
  <rect width="1200" height="800" fill="url(#wall)"/>
